<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — ODEM EVENT</title>
<link rel="icon" href="logo-odem.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500;600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#C9A84C;--noir:#0D0D0D;}
body{font-family:'Montserrat',sans-serif;background:var(--noir);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;}
.num{font-family:'Cormorant Garamond',serif;font-size:clamp(6rem,20vw,12rem);font-weight:300;color:var(--gold);line-height:1;opacity:0.15;}
.title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.8rem,5vw,2.8rem);font-weight:300;margin:1rem 0 0.5rem;}
.sub{font-size:0.7rem;letter-spacing:0.15em;color:rgba(255,255,255,0.4);margin-bottom:3rem;}
.btn{display:inline-block;padding:0.9rem 2.5rem;border:1px solid var(--gold);color:var(--gold);text-decoration:none;font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;transition:all 0.3s;}
.btn:hover{background:var(--gold);color:var(--noir);}
</style>
</head>
<body>
<div>
  <div class="num">404</div>
  <h1 class="title">Page <em>introuvable</em></h1>
  <p class="sub">Cette page n'existe pas ou a été déplacée</p>
  <a href="index.html" class="btn">Retour à l'accueil</a>
</div>
</body>
</html>
